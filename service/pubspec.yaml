name: docking_station_service
description: >-
  The docking station run as a service: it reads the record through the
  logbook's read socket and sends each decision through its write socket.
version: 0.0.1
repository: https://github.com/intersyntactic/docking_station
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_docking_station:
    path: ..
  is_flight_rules: ^0.1.0
  is_logbook_client: ^0.2.0
  is_teams_module:
    git:
      url: https://github.com/intersyntactic/teams_module.git
      ref: 46ad868485d9b63a9a8c7e401a3bcc9ab7ce0f35

dependency_overrides:
  # is_teams_module pins is_docking_station to a commit of its own; pub won't
  # mix a git source and a path source for one package, so the library beside
  # this package wins.
  is_docking_station:
    path: ..
  # is_teams_module asks for is_shapes ^0.4.0 but uses neither renamed id,
  # so it builds on 0.5.0. Drop this once it allows 0.5.0.
  is_shapes: ^0.5.0

dev_dependencies:
  is_conversation_shapes: ^0.8.2
  is_shapes: ^0.5.0
  lints: ^6.1.0
  test: ^1.33.0
