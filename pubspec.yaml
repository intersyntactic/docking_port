name: is_docking_station
description: >-
  The docking station, a core piece of intersyntactic: it reads events from
  the record in order and admits each one under a journey path (RULINGS).
version: 0.0.1
repository: https://github.com/intersyntactic/docking_station
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_annotation_shapes: ^0.3.1
  is_conversation_shapes: ^0.8.2
  # path_start.dart takes ObjectId from here, never the client, so the
  # airlock that imports it reaches no socket code.
  is_logbook: ^0.2.0
  # Swap for `^0.2.0` once is_logbook_client 0.2.0 is on pub.dev
  # (logbook_client PR 8).
  is_logbook_client:
    git:
      url: https://github.com/intersyntactic/logbook_client.git
      ref: fcb4c498f8213d49b500d61a14925e8eb46dc624
  is_shapes: ^0.5.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
