name: is_docking_station
description: >-
  The docking station, a core piece of intersyntactic: it reads events from
  the record in order and admits each one under a journey path (RULINGS).
version: 0.0.1
repository: https://github.com/intersyntactic/docking_station
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  checked_json: ^0.2.1
  is_annotation_shapes: ^0.3.0
  is_conversation_shapes: ^0.8.0
  is_logbook: ^0.1.0
  # Swap for `^0.1.0` once is_logbook_client is on pub.dev (logbook_client
  # PR 6, waiting on Nick's go).
  is_logbook_client:
    git:
      url: https://github.com/intersyntactic/logbook_client.git
      ref: 863cf6e5
  is_shapes: ^0.4.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
