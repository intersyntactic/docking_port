name: is_docking_port
description: >-
  The docking port, a core piece of intersyntactic: it reads arrivals from
  the record in order and admits each one under a journey path (RULINGS).
version: 0.0.1
repository: https://github.com/intersyntactic/docking_port
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  is_airlock_api: ^0.2.0
  # Response (is_annotation_shapes 0.2.1) isn't published yet: pinned to
  # https://github.com/intersyntactic/annotation_shapes/pull/11's head until
  # it is, then ^0.2.1.
  is_annotation_shapes:
    git:
      url: https://github.com/intersyntactic/annotation_shapes.git
      ref: 56a58d89b009e6def38390193c5f6ba61881420b
  is_conversation_shapes: ^0.4.0
  is_journal: ^0.5.0
  is_shapes: ^0.4.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
