name: is_docking_station
description: >-
  The docking station, a core piece of intersyntactic: it reads events from
  the record in order and admits each one under a journey path (RULINGS).
version: 0.0.1
repository: https://github.com/intersyntactic/docking_station
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  agent_loop:
    git:
      url: https://github.com/intersyntactic/agent_loop.git
      ref: 207690a
  checked_json: ^0.2.1
  is_annotation_shapes:
    git:
      url: https://github.com/intersyntactic/annotation_shapes.git
      ref: dbcc23399b7a678b397e6c2470d470523aee6b14
  is_conversation_shapes: ^0.8.0
  is_journal: ^0.5.0
  is_shapes: ^0.4.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
